# Backup diario de la base de datos a las 03:00 (hora del cluster).
# Guarda un .sql.gz por día en el volumen backup-pvc y conserva los últimos 14 días.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: default
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - >
                  FECHA=$(date +%Y-%m-%d_%H%M);
                  pg_dump -h postgres-service -U agx -d agx_health | gzip > /backups/agx_${FECHA}.sql.gz &&
                  echo "Backup creado: agx_${FECHA}.sql.gz" &&
                  find /backups -name 'agx_*.sql.gz' -mtime +14 -delete
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backup-pvc
