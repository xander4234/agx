apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/xander4234/agx/frontend:faf7f38b3cc6a503a75d42bdf6ce12d006a66a29
          imagePullPolicy: Always
          ports:
            - containerPort: 80