apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/xander4234/agx/frontend:9117cd55a4a3cb8388fe04eac4860ec830c9199c
          imagePullPolicy: Always
          ports:
            - containerPort: 80