apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      # Espera a Postgres y crea las tablas + usuario superadmin (idempotente)
      initContainers:
        - name: db-init
          image: ghcr.io/xander4234/agx/server:963db1d4b4b7235babb4d4689b6b44ebf461b21c
          command: ["node", "db_init.js"]
          envFrom:
            - configMapRef:
                name: server-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: PGPASSWORD
      containers:
        - name: server
          image: ghcr.io/xander4234/agx/server:963db1d4b4b7235babb4d4689b6b44ebf461b21c
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: server-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: JWT_SECRET
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: PGPASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: server-secret
                  key: OPENAI_API_KEY
          # Exámenes/archivos subidos — sobreviven a reinicios y actualizaciones
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          # Health checks — K8s reinicia el pod si deja de responder
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
