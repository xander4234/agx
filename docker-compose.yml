services:
  db:
    image: postgres:16
    container_name: agx_health_db
    environment:
      POSTGRES_USER: agx
      POSTGRES_PASSWORD: agxpass
      POSTGRES_DB: agx_health
    ports:
      - "5435:5432"
    volumes:
      - agx_health_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agx -d agx_health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  agx_health_pgdata:
